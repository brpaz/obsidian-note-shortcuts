name: Draftsman

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Keeps a continuously-updated draft release with generated changelog
  # notes in sync with main, so cutting a release is just tagging it.
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: brpaz/draftsman@v0.2.3
        with:
          command: draft
          backend: github
          token: ${{ secrets.GITHUB_TOKEN }}

  # Promotes the matching draft to a real, published release. That
  # publish event is what triggers ci.yml's attach-release-assets job.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: brpaz/draftsman@v0.2.3
        with:
          command: publish
          backend: github
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.version.outputs.value }}
